<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoplay Slider with Pause on Hover</title>
    <link rel="stylesheet" href="../../gemslider.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            color: #333;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .feature-list {
            margin-top: 30px;
        }
        .feature-list h3 {
            margin-bottom: 10px;
        }
        .feature-list ul {
            margin-bottom: 20px;
        }
        .controls {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            gap: 10px;
        }
        .controls button {
            padding: 8px 16px;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .controls button:hover {
            background: #555;
        }
        .gem-slide {
            height: 400px;
        }
        .gem-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <h1>GemSlider - Autoplay Example</h1>
    
    <div class="container">
        <div class="gem-slider autoplay-slider">
            <div class="gem-track">
                <div class="gem-slide"><img data-src="https://picsum.photos/800/400?random=10" alt="Landscape Image 1"></div>
                <div class="gem-slide"><img data-src="https://picsum.photos/800/400?random=11" alt="Landscape Image 2"></div>
                <div class="gem-slide"><img data-src="https://picsum.photos/800/400?random=12" alt="Landscape Image 3"></div>
                <div class="gem-slide"><img data-src="https://picsum.photos/800/400?random=13" alt="Landscape Image 4"></div>
                <div class="gem-slide"><img data-src="https://picsum.photos/800/400?random=14" alt="Landscape Image 5"></div>
            </div>
            <div class="gem-dots"></div>
        </div>
        
        <div class="controls">
            <button id="pause-btn">Pause</button>
            <button id="play-btn">Play</button>
            <button id="speed-btn">Speed Up</button>
        </div>
        
        <div class="feature-list">
            <h3>Features Demonstrated:</h3>
            <ul>
                <li>Autoplay with customizable speed</li>
                <li>Pause on hover functionality</li>
                <li>Progress bar indicator</li>
                <li>Lazy loading of images</li>
                <li>Programmatic control (pause/play)</li>
                <li>Accessibility improvements</li>
            </ul>
        </div>
    </div>
      
    <script src="../../gemslider.js"></script>
    <script>
        // Initialize slider
        const slider = new GemSlider(document.querySelector('.autoplay-slider'), {
            autoplay: true,
            autoplaySpeed: 3000,
            pauseOnHover: true,
            dots: '.gem-dots',
            lazyLoad: true,
            progressBar: true,
            accessibility: true
        });
        
        // Control buttons
        document.getElementById('pause-btn').addEventListener('click', function() {
            slider.pauseAutoplay();
        });
        
        document.getElementById('play-btn').addEventListener('click', function() {
            slider.resumeAutoplay();
        });
        
        document.getElementById('speed-btn').addEventListener('click', function() {
            // Toggle between normal and fast speed
            const currentSpeed = slider.options.autoplaySpeed;
            const newSpeed = currentSpeed === 3000 ? 1000 : 3000;
            slider.setOption('autoplaySpeed', newSpeed);
            this.textContent = newSpeed === 1000 ? 'Slow Down' : 'Speed Up';
        });
    </script>
</body>
</html>
